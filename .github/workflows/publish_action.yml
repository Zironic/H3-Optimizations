name: Validate and publish to Comfy registry

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  package-check:
    name: Package and release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package-check dependency
        run: python -m pip install pathspec

      - name: Check the Registry package
        run: python .github/scripts/check_registry_package.py

      - name: Verify runtime and package versions match
        shell: python
        run: |
          import pathlib
          import re
          import tomllib

          root = pathlib.Path.cwd()
          project_version = tomllib.loads(
              (root / "pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          init_text = (root / "h3_optimizations" / "__init__.py").read_text(
              encoding="utf-8"
          )
          match = re.search(r"^__version__\s*=\s*['\"]([^'\"]+)['\"]", init_text, re.M)
          if match is None:
              raise SystemExit("h3_optimizations.__version__ is missing")
          runtime_version = match.group(1)
          if runtime_version != project_version:
              raise SystemExit(
                  f"version mismatch: runtime={runtime_version} pyproject={project_version}"
              )
          print(f"version metadata agrees: {project_version}")

  syntax:
    name: Python ${{ matrix.python-version }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q h3_optimizations tests

  cpu-tests:
    name: CPU tests / ComfyUI ${{ matrix.comfy-ref }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        comfy-ref: ["v0.33.0", "v0.34.0"]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out ComfyUI ${{ matrix.comfy-ref }}
        uses: actions/checkout@v7
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ matrix.comfy-ref }}
          path: ComfyUI

      - name: Check out H3 Optimizations as a custom node
        uses: actions/checkout@v7
        with:
          path: ComfyUI/custom_nodes/H3-Optimizations

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ComfyUI/requirements.txt

      - name: Install ComfyUI and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ComfyUI/requirements.txt pytest tomli

      - name: Run CPU correctness suite
        working-directory: ComfyUI/custom_nodes/H3-Optimizations
        env:
          CUDA_VISIBLE_DEVICES: "-1"
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
        run: |
          python -m pytest -q tests \
            --ignore-glob='tests/test_bench_*' \
            --ignore-glob='tests/*_benchmark.py' \
            --ignore-glob='tests/*_sweep.py'

  publish-node:
    name: Publish Custom Node to registry
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - package-check
      - syntax
      - cpu-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

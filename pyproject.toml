[project]
name = 'h3-optimizations'
version = '0.2.41'
description = 'Production sparse attention, token ordering, and memory optimization nodes for MiniMax H3 in ComfyUI'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = []
classifiers = [
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX :: Linux',
]

[project.urls]
Repository = 'https://github.com/Zironic/H3-Optimizations'
Issues = 'https://github.com/Zironic/H3-Optimizations/issues'

[tool.comfy]
PublisherId = 'zironic'
DisplayName = 'H3 Optimizations'
requires-comfyui = '>=0.33.0'

[tool.ruff]
line-length = 100
